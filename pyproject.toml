[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boptest-simulator"
version = "0.1.0"
description = "Python-only interactive and batch server for BOPTEST test cases"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
mcp = ["mcp==2.3.0", "httpx==0.28.1"]

[project.scripts]
boptest-simulator = "boptest_simulator.__main__:main"
boptest-simulator-benchmark = "boptest_simulator.benchmark:main"
boptest-simulator-mcp = "boptest_simulator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
